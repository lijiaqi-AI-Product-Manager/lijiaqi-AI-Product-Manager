<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-labelledby="title description"><title id="title">AgentCompare — npm daily download requests</title><desc id="description">Daily package download requests from reported dates. Repeated or automated requests may be included; these are not unique users. Updated 2026-11-04 UTC</desc><rect width="400" height="360" rx="18" fill="#101b1c"/><g font-family="Segoe UI,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="600" fill="#e5f0eb">AgentCompare</text><text x="20" y="61" font-size="13" fill="#a3b9b1">npm daily download requests</text><text x="380" y="38" text-anchor="end" font-size="24" font-weight="600" fill="#e5f0eb">—</text><text x="380" y="61" text-anchor="end" font-size="11" fill="#a3b9b1">requests in shown period</text><text x="200.0" y="200" text-anchor="middle" font-size="16" fill="#e5f0eb">Awaiting first daily statistics</text><text x="200.0" y="226" text-anchor="middle" font-size="13" fill="#a3b9b1">Package published 2026-11-03</text><text x="20" y="309" font-size="11" fill="#a3b9b1">Updated 2026-11-04 UTC</text><text x="20" y="333" font-size="12" fill="#a3b9b1">npm download-counts · requests, not unique users.</text></g></svg>
