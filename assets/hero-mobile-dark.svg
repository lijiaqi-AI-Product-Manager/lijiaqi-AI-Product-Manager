<rect x="1" y="1" width="622" height="498" rx="24" fill="#101c20" stroke="#30494b" /><text x="35" y="49" font-family="'Cascadia Code','Consolas',monospace" font-size="13" font-weight="600" fill="#9be4bc" >PRODUCT / AI / ENGINEERING</text><text x="31" y="142" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="74" font-weight="700" fill="#ecf3ec" >李佳奇</text><text x="35" y="187" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="28" font-weight="400" fill="#a3bab5" >Li Jiaqi / Gauss</text><text x="35" y="247" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="27" font-weight="500" fill="#ecf3ec" >把真实问题，做成好用的产品。</text><text x="35" y="280" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="400" fill="#a3bab5" >Turning real problems into useful products.</text><path d="M35,309 L589,309" stroke="#30494b" stroke-width="1" fill="none" /><text x="35" y="350" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="25" font-weight="600" fill="#ecf3ec" >AI 产品经理</text><text x="35" y="381" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="21" font-weight="400" fill="#a3bab5" >AI Product Manager</text><text x="35" y="420" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="400" fill="#ecf3ec" >厦门大学 · 2029 届</text><text x="35" y="450" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="400" fill="#a3bab5" >Xiamen University · Class of 2029</text><text x="35" y="481" font-family="'Cascadia Code','Consolas',monospace" font-size="13" font-weight="400" fill="#a3bab5" >Research → Build → Verify → Iterate</text><ellipse cx="492" cy="138" rx="67" ry="53" fill="none" stroke="#9be4bc" opacity=".4" transform="rotate(-28 492 138)"/><circle cx="492" cy="138" r="35" fill="#203a37" /><text x="492" y="148" font-family="'Cascadia Code