name: Project growth charts

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_growth.py
      - data/growth-config.json
      - .github/workflows/growth-charts.yml

permissions:
  contents: read

concurrency:
  group: project-growth-charts
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'lijiaqi-AI-Product-Manager/lijiaqi-AI-Product-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check metric handling
        run: python -m unittest discover -s tests -p 'test_growth.py'
      - name: Refresh public charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_growth.py
      - name: Save updated charts
        run: |
          git add assets/growth data/growth.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '更新项目增长图表'
          git pull --rebase origin main
          git push origin HEAD:main
